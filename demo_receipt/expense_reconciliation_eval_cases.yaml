schema_version: 1
dataset_id: expense_assistant_external_evidence_v1
created_at: "2026-05-18"
case_count: 45
description: >
  Employee expense assistant eval set for Ctrip, Didi, and card
  reconciliation with deterministic mock provider data and replayable traces.
provider_fixtures:
  ctrip: mock_ctrip_bookings.yaml
  didi: mock_didi_trips.yaml
  card: mock_card_transactions.yaml
receipt_ocr_fixtures: receipt_ocr_overrides.yaml
global_expectations:
  external_tools:
    - lookup_ctrip_booking
    - lookup_didi_trip
    - lookup_card_transaction
  write_tools:
    - update_draft_field
  trace_required_fields:
    - trace_id
    - tool_name
    - provider_domain
    - provider_mode
    - fixture_id
    - attempt_index
    - request_normalized
    - response_normalized
    - candidate_count
    - reconciliation_status
cases:
  # Golden path: unique match across Ctrip/Didi/card evidence.
  - id: golden_001_ctrip_hotel_shenzhen_card_match
    group: golden_path
    scenario: ctrip_card_unique_match
    tags: [golden, ctrip, hotel, card, write]
    context: {employee_id: emp_dev, draft_id: draft-golden-001}
    receipt: {image: invoice_receipt_04.jpg, ocr_fixture_id: ocr_eval_ctrip_hotel_shenzhen_680}
    user_message: "深圳酒店发票拍糊了，携程订单是 5月9日 680 元，帮我补齐住宿报销。"
    fixtures: {ctrip: ctrip_gold_hotel_shenzhen_680, card: card_gold_hotel_shenzhen_680}
    expected:
      decision: can_write_draft
      must_call_tools: [lookup_ctrip_booking, lookup_card_transaction, update_draft_field]
      final_fields: {merchant: 深圳南山商务酒店, amount: 680.00, date: "2026-05-09", category: accommodation}
      field_sources: {amount: ctrip_card_match}
      trace: {provider_calls: 2, replayable: true}

