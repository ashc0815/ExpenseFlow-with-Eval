# ── Receipt completion regression cases ──────────────────────────────────────
- id: complete_didi_missing_invoice_card_match
  suite: receipt_completion_regression
  scenario: receipt_completion
  difficulty: regression
  tags: [didi, card, missing_invoice, model_matrix]
  messages:
    - role: user
      content: "打车发票找不到了，5月8日公司到虹桥机场，信用卡扣了 86 元，能帮我补齐吗？"
  scripted_turns:
    - text: "我先用信用卡和滴滴行程交叉核验。"
      tool_calls:
        - name: lookup_card_transaction
          input: {date: "2026-05-08", amount: 86, merchant_hint: "DIDI"}
        - name: lookup_didi_trip
          input: {date: "2026-05-08", amount: 86, city: "上海"}
    - text: "两边金额和日期一致，我把草稿补齐，并在说明里保留证据来源。"
      tool_calls:
        - name: update_draft_field
          input: {field: merchant, value: "滴滴出行", source: "didi_card_match"}
        - name: update_draft_field
          input: {field: amount, value: "86", source: "didi_card_match"}
        - name: update_draft_field
          input: {field: date, value: "2026-05-08", source: "didi_card_match"}
        - name: update_draft_field
          input: {field: category, value: transport, source: "agent_suggested"}
        - name: update_draft_field
          input: {field: description, value: "滴滴行程：公司到虹桥机场；证据：滴滴行程 + 信用卡 DIDI CHUXING 86 元", source: "didi_card_match"}
  final_text: "已按滴滴行程和信用卡交易补齐：86 元，交通，2026-05-08。"
  expect:
    must_call_tools: [lookup_card_transaction, lookup_didi_trip, update_draft_field]
    required_subagents: [evidence-reconciler, draft-writer]
    agent_trace_present: true
    final_fields: {merchant: "滴滴出行", amount: 86, date: "2026-05-08", category: transport}
    field_sources_include:
      amount: "didi_card_match"
    response_contains: ["滴滴", "信用卡"]

