        - name: lookup_card_transaction
          input: {date: "2026-05-08", amount: 1280, merchant_hint: "CTRIP"}
    - text: "订单和扣款一致，我先补齐草稿并标注发票待补。"
      tool_calls:
        - name: update_draft_field
          input: {field: merchant, value: "携程旅行", source: "ctrip_card_match"}
        - name: update_draft_field
          input: {field: amount, value: "1280", source: "ctrip_card_match"}
        - name: update_draft_field
          input: {field: date, value: "2026-05-08", source: "ctrip_card_match"}
        - name: update_draft_field
          input: {field: category, value: transport, source: "agent_suggested"}
        - name: update_draft_field
          input: {field: description, value: "上海虹桥至深圳宝安机票；证据：携程订单 + 信用卡交易；发票待补", source: "ctrip_card_match"}
  final_text: "已补齐机票草稿，但发票仍需后补或按公司流程说明。"
  expect:
    must_call_tools: [lookup_ctrip_booking, lookup_card_transaction, update_draft_field]
    required_subagents: [evidence-reconciler, draft-writer]
    agent_trace_present: true
    final_fields: {merchant: "携程旅行", amount: 1280, date: "2026-05-08", category: transport}
    response_contains: ["发票待补", "携程", "信用卡"]

