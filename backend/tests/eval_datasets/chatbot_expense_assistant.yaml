# Unified Expense Assistant — policy QA, receipt completion, long-tail bad cases
#
# This suite is intentionally end-to-end at the chat/tool layer. Each case is a
# Task/Case. A pytest parametrized run is one Trial. The emitted SSE events plus
# final draft state are the Trajectory/Trace. Graders are mostly binary.

# ── Policy QA regression cases ───────────────────────────────────────────────
- id: policy_meal_limit_l3_tier1_city
  suite: policy_qa_regression
  scenario: policy_qa
  difficulty: regression
  tags: [policy, meal, model_matrix]
  messages:
    - role: user
      content: "上海 L3 员工餐饮报销限额是多少？"
  scripted_turns:
    - text: "我先查一下公司报销政策。"
      tool_calls:
        - name: get_policy_rules
          input: {}
  final_text: "上海属于一线城市，L3 餐饮限额以政策表为准；提交时请保留发票和用餐说明。"
  expect:
    must_call_tools: [get_policy_rules]
    forbidden_tools: [update_draft_field, lookup_card_transaction, submit_report, approve_report]
    response_contains: ["政策", "L3", "餐饮"]
    no_hallucinated_policy: true

